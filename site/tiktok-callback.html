<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok sign-in — GTAClipz</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:680px;margin:48px auto;padding:0 20px;color:#1a1a1a}
code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;font-size:15px}
button{margin-top:12px;padding:10px 18px;font-size:16px;border-radius:8px;border:0;background:#0b57d0;color:#fff;cursor:pointer}
.err{color:#b3261e}</style></head><body>
<h1>TikTok sign-in</h1>
<div id="out">Reading the response from TikTok…</div>
<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  var out = document.getElementById('out');
  if (p.get('error')) {
    out.innerHTML = '<p class="err">TikTok returned an error: <b>' +
      (p.get('error_description') || p.get('error')).replace(/</g, '&lt;') + '</b></p>';
    return;
  }
  var code = p.get('code');
  if (!code) { out.textContent = 'No sign-in code found. This page is only used during TikTok sign-in.'; return; }
  out.innerHTML = '<p>Copy this code and paste it into the window running <b>tiktok_auth.py</b>. ' +
    'It expires in <b>5 minutes</b> and works once.</p><code id="c"></code>' +
    '<button id="b">Copy code</button>';
  document.getElementById('c').textContent = code;
  document.getElementById('b').onclick = function () {
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById('b').textContent = 'Copied ✓';
    });
  };
})();
</script>
<p><a href="index.html">GTAClipz home</a></p>
</body></html>
