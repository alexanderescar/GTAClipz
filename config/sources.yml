# ─────────────────────────────────────────────────────────────────────────────
# SOURCE REGISTRY  (researched 2026-11-17 — programs open/close weekly; recheck)
# ─────────────────────────────────────────────────────────────────────────────
# permission:
#   campaign  - you joined a paid clipping campaign; the brief IS the license.
#               Covers ONLY what the brief covers (e.g. a brand campaign covers
#               that brand's clips, not the creator's whole stream).
#   granted   - explicit yes in writing (DM/email). Save evidence.
#   published - public clip rules allowing reposts with credit. Link them.
#   own       - your own capture.
#   none      - SCOUTING LANE: discovered, scored, a few proof-of-concept clips
#               rendered for outreach — never published.
#
# lane is derived: publishable permission -> "publish", none -> "scout".
# Flip enabled:true on a campaign only AFTER you've joined it.
# Twitch logins marked (verify) — confirm on twitch.tv before relying on them.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  credit_template: "🎥 {streamer} — {link}"
  min_views: 500
  # HARD CAP at 59s. A YouTube Short LONGER than 60 seconds with ANY Content ID
  # claim is blocked WORLDWIDE. GTA radio is licensed music (real labels, not
  # Rockstar), so claims are near-certain on any clip with the radio audible.
  # Under 60s a claim only redirects revenue; over 60s the clip dies entirely.
  max_clip_seconds: 59
  min_clip_seconds: 8

sources:

  # ── OPEN GTA CAMPAIGNS (join on contentrewards.com, then enable) ──────────
  - id: cr_lysium_benji_ramos
    platform: campaign
    streamer: "Lysium / Benji Ramos"
    permission: campaign
    campaign_url: "https://contentrewards.com"     # search "Lysium" on Discover
    rate_per_1k_usd: 1.50
    notes: "GTA roleplay streamer campaign. Read the brief for required tags."
    platforms_allowed: [youtube, tiktok, instagram]
    longform: true            # campaigns hand you footage -> long-form clipper
    enabled: false

  - id: cr_gta6_tokyo_girl
