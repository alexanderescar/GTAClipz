# ─────────────────────────────────────────────────────────────────────────────
# SOURCE REGISTRY  (researched 2026-11-17 — programs open/close weekly; recheck)
# ─────────────────────────────────────────────────────────────────────────────
# permission:
#   campaign  - you joined a paid clipping campaign; the brief IS the license.
#               Covers ONLY what the brief covers (e.g. a brand campaign covers
#               that brand's clips, not the creator's whole stream).
#   granted   - explicit yes in writing (DM/email). Save evidence.
#   published - public clip rules allowing reposts with credit. Link them.
#   own       - your own capture.
#   none      - SCOUTING LANE: discovered, scored, a few proof-of-concept clips
#               rendered for outreach — never published.
#
# lane is derived: publishable permission -> "publish", none -> "scout".
# Flip enabled:true on a campaign only AFTER you've joined it.
# Twitch logins marked (verify) — confirm on twitch.tv before relying on them.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  credit_template: "🎥 {streamer} — {link}"
  min_views: 500
  # HARD CAP at 59s. A YouTube Short LONGER than 60 seconds with ANY Content ID
  # claim is blocked WORLDWIDE. GTA radio is licensed music (real labels, not
  # Rockstar), so claims are near-certain on any clip with the radio audible.
  # Under 60s a claim only redirects revenue; over 60s the clip dies entirely.
  max_clip_seconds: 59
  min_clip_seconds: 8

sources:

  # ── JOINED CAMPAIGNS (2026-11-17) — permission: campaign ─────────────────
  # Each campaign's caption/hook/platform rules are applied automatically.
  # After a campaign clip posts, the review issue gets a "SUBMIT NOW" comment:
  # links must be submitted on contentrewards.com within 30 minutes.

  - id: cr_tomo
    platform: youtube_channel
    streamer: "Tomo"
    youtube_channel: "https://www.youtube.com/@Tomovids/streams"
    title_must_include: ["gta"]           # GTA VI streams only
    link: "youtube.com/@Tomovids"
    permission: campaign
    campaign: "TOMO GTA VI Clipping"
    campaign_url: "https://contentrewards.com/c/campaigns/df6de26f-86ec-4782-b818-1fc8053b99a4"
    rate_per_1k_usd: 2.00
    platforms_allowed: [youtube, tiktok, instagram]
    credit_template: "Subscribe to Tomo on YouTube → @Tomovids"
    hashtags: ["#tomovids", "#gta6"]
    hooks:                                # brief bans misleading / fake-context hooks
      - "Tomo plays GTA 6"
      - "Tomo's GTA 6 reaction"
      - "Tomo in Vice City"
    longform: true
    enabled: true

  - id: cr_lacy_gta
    platform: twitch
    streamer: "Lacy"
    twitch_login: "lacy"
    link: "twitch.tv/lacy"
    permission: campaign
    campaign: "$12,500 LACY GTA VI Marathon Pool"
    campaign_url: "https://contentrewards.com/c/campaigns/a5c63fad-cd53-4b81-9305-4a2d1696872a"
    pool: true                            # 750K total views to qualify; split by views
    platforms_allowed: [youtube, tiktok, instagram]
    credit_template: "LACY's GTA 6 marathon — twitch.tv/lacy"
    hashtags: ["#Lacy", "#gta6"]
    watermark: false                      # rules: "Logos of any kind are not allowed"
    hooks:
      - "LACY in GTA 6"
      - "LACY's GTA 6 marathon"
      - "LACY reacts in GTA 6"
    publish_after: "2026-11-18T00:00:00-05:00"
    longform: true
    enabled: true

  - id: cr_ruckus_dom
    platform: kick
    streamer: "Dasgas Dom"
    link: "kick.com/dasgasd3m"
    permission: campaign
    campaign: "Dasgasd3m x RUCKUS | GTA 6"
    campaign_url: "https://contentrewards.com/c/campaigns/051002dd-5c46-43d0-a446-43f2957ba3a9"
    rate_per_1k_usd: 1.00
    platforms_allowed: [youtube, tiktok]  # no Instagram in this campaign
    credit_template: "Dasgas Dom on Kick — kick.com/dasgasd3m · Paid partnership"
    hashtags: ["#dasgasdom3", "#gta6"]
    paid_promotion: true                  # brief: disclose paid campaign content
    hooks:
      - "Dasgas Dom plays GTA 6"
      - "Dasgas Dom's GTA 6 reaction"
    # Footage: ONLY his Nov 19 Kick stream. Paste the VOD link into
    # config/vod_queue.yml with source_id: cr_ruckus_dom after the stream ends.
    publish_after: "2026-11-19T09:00:00-08:00"
    publish_before: "2026-12-19T23:59:00-08:00"
    longform: true
    enabled: true

  # ── STREAMERS WITH PAID PROGRAMS (join, then flip permission+enabled) ─────
  - id: kaicenat
    platform: twitch
    streamer: "Kai Cenat"
    twitch_login: "kaicenat"
    link: "twitch.tv/kaicenat"
    permission: none          # -> campaign once you join a live Content Rewards pool
    notes: "Marathoning GTA 6 to 100% from launch. Pool campaigns (~$10K) on Content Rewards."
    longform: true
    enabled: true

  - id: jasontheween
    platform: twitch
    streamer: "JasonTheWeen"
    twitch_login: "jasontheween"
    link: "twitch.tv/jasontheween"
    permission: none          # CORE pool campaign on Content Rewards
    longform: true
    enabled: true

  # ── NO PUBLIC PROGRAM — scouting lane + outreach targets ──────────────────
  - id: xqc
    platform: twitch
    streamer: "xQc"
    twitch_login: "xqc"
    link: "twitch.tv/xqc"
    permission: none
    longform: true
    enabled: true

  - id: caseoh
    platform: twitch
    streamer: "CaseOh"
    twitch_login: "caseoh_"
    link: "twitch.tv/caseoh_"
    permission: none
    longform: true
    enabled: true

  - id: agent00
    platform: twitch
    streamer: "Agent00"
    twitch_login: "agent00"
    link: "twitch.tv/agent00"
    permission: none
    longform: true
    enabled: true

  # ── YOUTUBE x ROCKSTAR 24H LAUNCH STREAM — add the VOD link to vod_queue ──
  #    once it exists. Roster: Caylus, Zhong, Kat Buno, Jelly, Rivers,
  #    Jake Baldino, Cinna, Loserfruit (AU), JuanSGuarnizo (MX),
  #    GamerCosta (BR), MikeShowSha (IT), Any Austin. Best ask-first targets.

  # ── YOUR OWN CAPTURE — always publishable ─────────────────────────────────
  - id: own_capture
    platform: local
    streamer: "You"
    permission: own
    watch_dir: "work/raw/own"
    platforms_allowed: [youtube, tiktok, instagram]
    enabled: true
