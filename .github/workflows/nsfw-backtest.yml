name: Nudity check backtest

# Manual: score recent reviewed/posted clips with src/nsfw.py and save the
# table to docs/nsfw_backtest.md, to tune the thresholds in settings.yml.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent clips to check"
        default: "150"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - run: python scripts/nsfw_backtest.py "${{ inputs.limit }}"
      - name: Save the results
        run: |
          git config user.name "gta-clip-factory"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nsfw_backtest.md
          git commit -m "nsfw backtest [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
