name: GTA6 Clip Factory

# Free tier: unlimited Actions minutes on a PUBLIC repo, 2,000 min/month on a
# private one. A full discover+render+publish cycle costs ~4-8 min, so even on
# a private repo you get ~250 cycles/month. Launch week wants the 30-min
# cadence; after that, drop to hourly.
on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min, UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "run | status | r2test | twitchtest | igtest | yttest | tiktoktest | e2etest | discover | vods | longform | download | render | review | publish"
        default: "run"

permissions:
  contents: write      # commit the state ledger back
  issues: write        # the daily clip-review issue

concurrency:
  group: clip-factory          # never let two runs fight over state
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install TwitchDownloaderCLI (chat replays for the long-form clipper)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R lay295/TwitchDownloader -p '*Linux-x64.zip' -D /tmp/tdl
          mkdir -p "$HOME/bin" && unzip -oq /tmp/tdl/*.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/TwitchDownloaderCLI"
          echo "TDCLI=$HOME/bin/TwitchDownloaderCLI" >> "$GITHUB_ENV"

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Restore YouTube token
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p state
          printf '%s' "$YT_TOKEN_JSON" > state/youtube_token.json

      - name: Run pipeline
        env:
          TWITCH_CLIENT_ID:      ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET:  ${{ secrets.TWITCH_CLIENT_SECRET }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:       ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY:     ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:  ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN:  ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN:          ${{ github.token }}   # review issues; built in, no setup
        run: python src/pipeline.py "${{ inputs.mode || 'run' }}"

      - name: Persist state
        # The SQLite ledger is what stops duplicate posts across runs.
        # Committing it back is the simplest free persistence that survives
        # a cold runner. (Swap for an R2 object if the repo churn annoys you.)
        run: |
          git config user.name  "clip-factory"
          git config user.email "actions@users.noreply.github.com"
          for f in state/factory.db state/tiktok.enc config/settings.yml; do [ -e "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
          git push || echo "nothing to push"

      - name: Upload failed renders for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: work/out/
          retention-days: 2
